services:
  postgres:
    image: postgres:16-alpine
    container_name: bankai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankai}
      POSTGRES_USER: ${POSTGRES_USER:-bankai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankai}
    ports:
      - "5432:5432"
    volumes:
      - bankai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: bankai-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bankai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bankai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bankai}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "${SERVER_PORT:-8080}:8080"
      
  frontend:
    build:
      context: ./frontend
      args:
        API_URL: ${FRONTEND_API_URL:-http://localhost:8080/api/v1}
    container_name: bankai-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
volumes:
  bankai_pgdata:
