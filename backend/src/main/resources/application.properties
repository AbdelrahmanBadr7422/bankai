spring.application.name=bankai
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bankai}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bankai}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT auth is done by our own filter; skip Boot's generated in-memory user.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# JWT (secret must be >= 32 characters; the default is for local development ONLY)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Initial administrator (created at startup only if both are set and the email does not exist yet)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

app.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.com.bankai.backend=DEBUG